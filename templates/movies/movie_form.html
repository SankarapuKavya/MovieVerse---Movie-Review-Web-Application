{% extends 'base.html' %}

{% block title %}
{{ page_title }} | MovieVerse
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <h2 class="mb-4">
                        {{ page_title }}
                    </h2>


                    <form
                        method="post"
                        enctype="multipart/form-data"
                    >

                        {% csrf_token %}

                        {{ form.as_p }}


                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Save Movie
                        </button>

                        <a
                            href="{% url 'movie_list' %}"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
